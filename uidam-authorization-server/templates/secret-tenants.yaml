{{/*
Creates one Secret per active tenant (plus the default tenant).
Values fall back to tenantSecrets.default when a tenant does not override them.
*/}}
{{- $defaultSecrets := .Values.tenantSecrets.default }}
{{- $tenantKeys := list "default" }}
{{- range $tenantKey, $tenantConfig := .Values.multiTenant.tenants }}
{{- if ne $tenantKey "default" }}
{{- if or (contains $tenantKey $.Values.multiTenant.tenantIds) (eq $tenantKey $.Values.multiTenant.defaultTenant) }}
{{- $tenantKeys = append $tenantKeys $tenantKey }}
{{- end }}
{{- end }}
{{- end }}
{{- range $tenantKey := $tenantKeys }}
{{- $secrets := mergeOverwrite (deepCopy $defaultSecrets) (default dict (index $.Values.tenantSecrets $tenantKey)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uidam-authorization-server.fullname" $ }}-tenant-{{ $tenantKey }}-credentials
  labels: {{- include "uidam-authorization-server.labels" $ | nindent 4 }}
type: Opaque
data:
  username: {{ $.Values.postgresql.userName | b64enc | quote }}
  password: {{ $.Values.postgresql.password | b64enc | quote }}
  keystorePassword: {{ $secrets.keystorePassword | b64enc | quote }}
  ignite.recaptcha.key.secret: {{ $secrets.igniteRecaptchaKeySecret | b64enc | quote }}
  clientsecretkey: {{ $secrets.clientsecretkey | b64enc | quote }}
  clientsecretsalt: {{ $secrets.clientsecretsalt | b64enc | quote }}
  clientSecret: {{ $secrets.clientSecret | b64enc | quote }}
  mfaSecretEncryptionKey: {{ $secrets.mfaSecretEncryptionKey | b64enc | quote }}
  mfaSecretEncryptionSalt: {{ $secrets.mfaSecretEncryptionSalt | b64enc | quote }}
  googleIDPSecret: {{ $secrets.googleIDPSecret | b64enc | quote }}
  githubIDPSecret: {{ $secrets.githubIDPSecret | b64enc | quote }}
  cognitoIDPSecret: {{ $secrets.cognitoIDPSecret | b64enc | quote }}
  azureIDPSecret: {{ $secrets.azureIDPSecret | b64enc | quote }}
{{- end }}
