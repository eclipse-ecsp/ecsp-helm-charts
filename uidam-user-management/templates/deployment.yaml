apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uidam-user-management.fullname" . }}
  labels: {{- include "uidam-user-management.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "uidam-user-management.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/config-tenants: {{ include (print $.Template.BasePath "/configmap-tenants-config.yaml") . | sha256sum }}
        checksum/config-default: {{ include (print $.Template.BasePath "/configmap-default-configurations.yaml") . | sha256sum }}
      labels: {{- include "uidam-user-management.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "uidam-user-management.fullname" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext: {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "uidam-user-management.fullname" . }}
        - configMapRef:
            name: {{ include "uidam-user-management.fullname" . }}-tenant-default
        {{- range $tenantKey, $tenantConfig := .Values.multiTenant.tenants }}
        {{- if ne $tenantKey "default" }}
        {{- if or (contains $tenantKey $.Values.multiTenant.tenantIds) (eq $tenantKey $.Values.multiTenant.defaultTenant) }}
        - configMapRef:
            name: {{ include "uidam-user-management.fullname" $ }}-tenant-{{ $tenantKey }}
        {{- end }}
        {{- end }}
        {{- end }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /notification
          name: {{ .Values.notification.config.configName }}
        env:
          - name: LOGLEVEL
            value: {{ .Values.logging.level | quote }}
          - name: POSTGRESQL_HOST
            value: "{{ .Values.postgresql.host }}"
          - name: POSTGRESQL_PORT
            value: "{{ .Values.postgresql.port }}"
          # Global secrets from main secret
          - name: POSTGRES_USERNAME
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.postgresql.secretName }}"
                key: username
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.postgresql.secretName }}"
                key: password
          - name: CLIENT_REGISTRATION_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.postgresql.secretName }}"
                key: clientsecretkey
          - name: CLIENT_REGISTRATION_SECRET_SALT
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.postgresql.secretName }}"
                key: clientsecretsalt   
          - name: CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.postgresql.secretName }}"
                key: revokeTokenClientSecret
          - name: INTITIAL_DATA_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.postgresql.secretName }}"
                key: liquibase_clientsecret
          - name: INTITIAL_DATA_USER_SALT
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.postgresql.secretName }}"
                key: liquibase_usersalt
          - name: INTITIAL_DATA_USER_PWD
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.postgresql.secretName }}"
                key: liquibase_userpwd
          - name: notification_email_provider_username
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.postgresql.secretName }}"
                key: smtp_username
          - name: notification_email_provider_passwd
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.postgresql.secretName }}"
                key: smtp_passwd
          {{- $defaultSecretName := printf "%s-tenant-default-credentials" (include "uidam-user-management.fullname" .) }}
          # DEFAULT tenant secrets (tenant-default.properties placeholders)
          - name: DEFAULT_POSTGRES_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ $defaultSecretName }}
                key: username
          - name: DEFAULT_POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ $defaultSecretName }}
                key: password
          - name: DEFAULT_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ $defaultSecretName }}
                key: revokeTokenClientSecret
          - name: DEFAULT_CLIENT_REGISTRATION_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: {{ $defaultSecretName }}
                key: clientsecretkey
          - name: DEFAULT_CLIENT_REGISTRATION_SECRET_SALT
            valueFrom:
              secretKeyRef:
                name: {{ $defaultSecretName }}
                key: clientsecretsalt
          - name: DEFAULT_MFA_SECRET_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: {{ $defaultSecretName }}
                key: mfaSecretEncryptionKey
          - name: DEFAULT_MFA_SECRET_ENCRYPTION_SALT
            valueFrom:
              secretKeyRef:
                name: {{ $defaultSecretName }}
                key: mfaSecretEncryptionSalt
          - name: DEFAULT_LIQUIBASE_INITIAL_DATA_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ $defaultSecretName }}
                key: liquibase_clientsecret
          - name: DEFAULT_LIQUIBASE_INITIAL_DATA_USER_SALT
            valueFrom:
              secretKeyRef:
                name: {{ $defaultSecretName }}
                key: liquibase_usersalt
          - name: DEFAULT_LIQUIBASE_INITIAL_DATA_USER_PWD
            valueFrom:
              secretKeyRef:
                name: {{ $defaultSecretName }}
                key: liquibase_userpwd
          - name: DEFAULT_NOTIFICATION_EMAIL_PROVIDER_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ $defaultSecretName }}
                key: smtp_username
          - name: DEFAULT_NOTIFICATION_EMAIL_PROVIDER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ $defaultSecretName }}
                key: smtp_passwd
          {{- range $tenantKey, $tenantConfig := .Values.multiTenant.tenants }}
          {{- if ne $tenantKey "default" }}
          {{- if or (contains $tenantKey $.Values.multiTenant.tenantIds) (eq $tenantKey $.Values.multiTenant.defaultTenant) }}
          {{- $tenantSecretName := printf "%s-tenant-%s-credentials" (include "uidam-user-management.fullname" $) $tenantKey }}
          # {{ $tenantKey | upper }} tenant secrets
          - name: tenants_profile_{{ $tenantKey }}_user-name
            valueFrom:
              secretKeyRef:
                name: {{ $tenantSecretName }}
                key: username
          - name: tenants_profile_{{ $tenantKey }}_password
            valueFrom:
              secretKeyRef:
                name: {{ $tenantSecretName }}
                key: password
          - name: tenants_profile_{{ $tenantKey }}_auth-server_client-secret
            valueFrom:
              secretKeyRef:
                name: {{ $tenantSecretName }}
                key: revokeTokenClientSecret
          - name: tenants_profile_{{ $tenantKey }}_client-registration_secret-key
            valueFrom:
              secretKeyRef:
                name: {{ $tenantSecretName }}
                key: clientsecretkey
          - name: tenants_profile_{{ $tenantKey }}_client-registration_secret-salt
            valueFrom:
              secretKeyRef:
                name: {{ $tenantSecretName }}
                key: clientsecretsalt
          - name: tenants_profile_{{ $tenantKey }}_mfa-secret-encryption-key
            valueFrom:
              secretKeyRef:
                name: {{ $tenantSecretName }}
                key: mfaSecretEncryptionKey
          - name: tenants_profile_{{ $tenantKey }}_mfa-secret-encryption-salt
            valueFrom:
              secretKeyRef:
                name: {{ $tenantSecretName }}
                key: mfaSecretEncryptionSalt
          - name: tenants_profile_{{ $tenantKey }}_liquibase_parameters_initial-data-client-secret
            valueFrom:
              secretKeyRef:
                name: {{ $tenantSecretName }}
                key: liquibase_clientsecret
          - name: tenants_profile_{{ $tenantKey }}_liquibase_parameters_initial-data-user-salt
            valueFrom:
              secretKeyRef:
                name: {{ $tenantSecretName }}
                key: liquibase_usersalt
          - name: tenants_profile_{{ $tenantKey }}_liquibase_parameters_initial-data-user-pwd
            valueFrom:
              secretKeyRef:
                name: {{ $tenantSecretName }}
                key: liquibase_userpwd
          - name: tenants_profile_{{ $tenantKey }}_notification_email_username
            valueFrom:
              secretKeyRef:
                name: {{ $tenantSecretName }}
                key: smtp_username
          - name: tenants_profile_{{ $tenantKey }}_notification_email_password
            valueFrom:
              secretKeyRef:
                name: {{ $tenantSecretName }}
                key: smtp_passwd
          {{- end }}
          {{- end }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: {{ .Values.notification.config.configName }}
          configMap:
            name: {{ include "uidam-user-management.fullname" . }}-notification-config
            optional: true
